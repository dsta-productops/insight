name: Windows build

# INSIGHT's Windows installer: a 7-Zip self-extracting .exe. A Tauri Windows
# build must be compiled ON Windows (WebView2 + MSVC), so this runs on a
# windows-latest runner. Tauri's own NSIS/MSI bundlers can't package the ~5 GB
# model payload, so we build the app unbundled and wrap it in an SFX (see
# scripts/package-sfx-windows.ps1 and WINDOWS_BUILD.md). Trigger manually from the
# Actions tab, or by pushing a v* tag. The installer is uploaded as a build
# artifact (and attached to the release for tag builds).
on:
  workflow_dispatch:
    inputs:
      llama_flavor:
        description: "llama.cpp GPU backend to bundle"
        type: choice
        default: vulkan
        options: [vulkan, cuda, cpu]
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The ~5 GB local models are the slow part; cache them across runs so only
      # the first build pays the Hugging Face download.
      - name: Cache local models
        uses: actions/cache@v4
        with:
          path: data/models
          key: insight-models-llama31-8b-q4km-whisper-largev3turbo-q5

      - name: Install dependencies
        run: npm ci

      - name: Stage bundle resources (server, models, binaries)
        shell: pwsh
        # GITHUB_TOKEN authenticates the script's llama.cpp releases-API lookup;
        # the runners' shared-IP anonymous API limit is otherwise exhausted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/prepare-bundle-windows.ps1 -LlamaFlavor ${{ github.event.inputs.llama_flavor || 'vulkan' }}

      # Build the app and wrap it in a 7-Zip self-extracting installer. Tauri's
      # own NSIS/MSI bundlers can't package the ~5 GB model payload (WiX CAB limit;
      # 32-bit makensis's ~2 GB output wall), so we ship an SFX, which has no such
      # limit. See WINDOWS_BUILD.md.
      - name: Build app + 7-Zip self-extracting installer
        shell: pwsh
        run: ./scripts/package-sfx-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: insight-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/sfx/INSIGHT_*_x64-setup.exe

      # For tag builds, also attach the installer to a GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/sfx/INSIGHT_*_x64-setup.exe
