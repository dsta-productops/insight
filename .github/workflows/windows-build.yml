name: Windows build

# INSIGHT's Windows (.exe / .msi) installer. A Tauri Windows build must be
# compiled ON Windows (WebView2 + MSVC + NSIS/WiX), so this runs on a
# windows-latest runner. Trigger manually from the Actions tab, or by pushing a
# v* tag. The installer is uploaded as a build artifact (and attached to the
# release for tag builds).
on:
  workflow_dispatch:
    inputs:
      llama_flavor:
        description: "llama.cpp GPU backend to bundle"
        type: choice
        default: vulkan
        options: [vulkan, cuda, cpu]
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The ~5 GB local models are the slow part; cache them across runs so only
      # the first build pays the Hugging Face download.
      - name: Cache local models
        uses: actions/cache@v4
        with:
          path: data/models
          key: insight-models-llama31-8b-q4km-whisper-largev3turbo-q5

      - name: Install dependencies
        run: npm ci

      - name: Stage bundle resources (server, models, binaries)
        shell: pwsh
        run: ./scripts/prepare-bundle-windows.ps1 -LlamaFlavor ${{ github.event.inputs.llama_flavor || 'vulkan' }}

      - name: Build Tauri app (.exe / .msi)
        run: npm run tauri:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: insight-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # For tag builds, also attach the installers to a GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
